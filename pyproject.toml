[project]
name = "reclaw-comms-mcp"
version = "0.1.0"
description = "MCP service for permissioned, structured agent-to-agent communications at Redesign Health"
requires-python = ">=3.12"
# Exact pins per the RH dependency-pinning policy (topics/09-security.md).
# fastmcp is pinned to the same version as rh-mcp / rh-google-mcp so
# MultiAuth / OIDCProxy / JWTVerifier behavior matches the fleet.
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastmcp==3.4.2",
    # greenlet is SQLAlchemy's async bridge — pinned explicitly (exact-pin
    # policy) rather than left as a floating transitive dep.
    "greenlet==3.5.4",
    "httpx==0.28.1",
    "py-key-value-aio[filetree]==0.4.5",
    "pydantic==2.12.5",
    "sqlalchemy[asyncio]==2.0.51",
    "structlog==25.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.14",
    "mypy==2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# reclaw-ea/ and reclaw-ea-mcp/ are sibling projects, each with their own
# pyproject.toml, deps, and lint/type config -- neither is part of this
# project and `uv sync --frozen` here never installs their dependencies
# (scheduler-mcp, the local reclaw-ea path dependency, etc.), so scanning
# them with this project's own tooling either double-lints them against the
# wrong rules or fails outright on unresolved imports. See each sibling's
# own README.md "Linting and type-checking" section for how to check it on
# its own terms.
exclude = ["reclaw-ea", "reclaw-ea-mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks are the established test idiom in the MCP fleet
# (mock patch + pytest.raises at distinct indentation levels aids readability).
"tests/*" = ["SIM117"]
# Alembic autogenerates these; they're reviewed but not hand-formatted, so
# don't hold them to the same line-length bar as authored code.
"migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
# "tests/" excludes this project's OWN test suite from strict mode;
# "reclaw-ea/"/"reclaw-ea-mcp/" exclude the sibling projects entirely --
# see the matching comment on [tool.ruff] above.
exclude = ["tests/", "reclaw-ea/", "reclaw-ea-mcp/"]

[[tool.mypy.overrides]]
module = ["key_value.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# reclaw_ea/scheduler_mcp are installed into the shared venv separately
# from this project's own uv.lock (see ea-deps/ and
# scripts/install-ea-deps.sh) -- root's own `uv sync` never installs them,
# so a plain lint/type-check run here never has them on disk. Even when
# they ARE installed (e.g. the Docker build, or a dev machine that's run
# install-ea-deps.sh), neither package ships a py.typed marker or stubs, so
# full type-checking against them was never going to work regardless.
module = ["reclaw_ea.*", "scheduler_mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
# Flat-layout app (main.py, providers/, etc.) — no installable package.
# The Dockerfile uses `uv sync --no-install-project` so the wheel is never
# built in prod (same idiom as rh-mcp).
py-modules = []

[tool.uv]
# Supply-chain defense: refuse packages published in the last 7 days
# (same idiom as rh-mcp / rh-google-mcp).
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
