# Lint, type-check, and test jobs for agent-comms-mcp.
# The test job runs a Postgres service (16.6, matching docker-compose.yml)
# on the standard 5432 port.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Pinned; must be recent enough to parse this repo's uv.lock revision.
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_comms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest --tb=short -q

  build:
    name: Docker build
    runs-on: ubuntu-latest
    # Only push on main: the ECR push role trusts this repo's main branch only —
    # a PR/feature-branch run would fail AssumeRoleWithWebIdentity anyway,
    # so push steps are gated on github.ref == 'refs/heads/main'.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t agent-comms-mcp:${{ github.sha }} .

      - name: Smoke-test entry points
        run: |
          docker run --rm --entrypoint sh agent-comms-mcp:${{ github.sha }} -c \
            "command -v agent-comms-mcp && command -v agent-comms-mcp-migrate"

      - name: Verify pyproject.toml version matches requirements.lock pin
        run: |
          LOCK_VER=$(grep '^agent-comms-mcp==' requirements.lock | head -1 | cut -d= -f3 | tr -d ' \\')
          grep -q "version = \"$LOCK_VER\"" pyproject.toml

      - name: Verify migration continuity (wheel vs repo)
        run: |
          LOCK_VER=$(grep '^agent-comms-mcp==' requirements.lock | head -1 | cut -d= -f3 | tr -d ' \\')
          pip download "agent-comms-mcp==${LOCK_VER}" --dest /tmp/acm-dl --no-deps --quiet --prefer-binary
          python3 - <<'EOF'
          import zipfile, os, sys
          wheel_dir = '/tmp/acm-dl'
          wheel_file = next((f for f in os.listdir(wheel_dir) if f.endswith('.whl')), None)
          assert wheel_file, f"No .whl found in {wheel_dir} — pip may have downloaded an sdist only"
          with zipfile.ZipFile(os.path.join(wheel_dir, wheel_file)) as z:
              wheel_migrations = sorted(
                  n.split('/')[-1] for n in z.namelist()
                  if 'migrations/versions/' in n and n.endswith('.py')
              )
          repo_migrations = sorted(f for f in os.listdir('migrations/versions') if f.endswith('.py'))
          if wheel_migrations != repo_migrations:
              print(f"Migration mismatch!\nWheel: {wheel_migrations}\nRepo:  {repo_migrations}", file=sys.stderr)
              sys.exit(1)
          # Filename equality only confirms the *set* matches -- also byte-diff
          # the migrations this bump introduces, so an in-place-amended body or
          # a corrected down_revision doesn't slip through unnoticed. Scoped to
          # just these three (not every repo migration) because older,
          # already-merged migration files are allowed to diverge from the
          # wheel for reasons unrelated to this bump (e.g. idempotency
          # hardening from a prior PR's own review) -- update this list on the
          # next version bump to name whatever migrations *that* bump adds.
          NEW_MIGRATIONS_THIS_BUMP = [
              "a1b2c3d4e5f6_add_is_shared_to_agents.py",
              "2cc5185360c7_add_agents_schema_version_range.py",
              "bb1ea7d2a0cf_partial_index_for_case_insensitive_.py",
          ]
          mismatched = []
          with zipfile.ZipFile(os.path.join(wheel_dir, wheel_file)) as z:
              wheel_bytes_by_name = {
                  n.split('/')[-1]: z.read(n) for n in z.namelist()
                  if 'migrations/versions/' in n and n.endswith('.py')
              }
          for name in NEW_MIGRATIONS_THIS_BUMP:
              with open(os.path.join('migrations/versions', name), 'rb') as f:
                  if f.read() != wheel_bytes_by_name[name]:
                      mismatched.append(name)
          if mismatched:
              print(f"Migration content mismatch (byte-for-byte diff from wheel): {mismatched}", file=sys.stderr)
              sys.exit(1)
          print(f"Migration continuity OK: {len(wheel_migrations)} files match (filenames + content for this bump's new files)")
          EOF

      - name: Configure AWS credentials (dev ECR push)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-dev-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR (dev)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push image (dev)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker tag agent-comms-mcp:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"

      - name: Configure AWS credentials (prod ECR push)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR (prod)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push image (prod)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker tag agent-comms-mcp:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
