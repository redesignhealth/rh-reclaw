# Adapted from the RH Python CI template (rh-tech-guide topics/06-ci-cd.md)
# and rh-data-platform/.github/workflows/ci.yml idioms (pinned uv, frozen
# sync, cached venv). No Postgres service yet — the skeleton has no
# database code; add the postgres service block when the comms domain
# schema lands.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Pinned; must be recent enough to parse this repo's uv.lock
          # revision. Matches the Dockerfile's uv pin.
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest --tb=short -q

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build-only for now: ECR push (OIDC role + repository) is provisioned
      # alongside the mcp-server Terraform module when this service gets its
      # deploy pipeline — see README "Deployment". No static AWS credentials.
      - name: Build image
        run: docker build -t reclaw-comms-mcp:${{ github.sha }} .
