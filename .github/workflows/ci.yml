# Adapted from the RH Python CI template (rh-tech-guide topics/06-ci-cd.md)
# and rh-data-platform/.github/workflows/ci.yml idioms (pinned uv, frozen
# sync, cached venv). The test job runs a Postgres service (16.6, matching
# docker-compose.yml) on the standard 5432 port — GitHub Actions runners
# don't have the local-native-Postgres port conflict that docker-compose.yml
# works around with an alternate host port (see README.md).
#
# This workflow covers ONLY this project (reclaw-comms-mcp, at the repo
# root). Neither reclaw-ea/ nor reclaw-ea-mcp/ (sibling projects) have a CI
# job yet — both transitively depend on the private Gitea `rh-auth` package
# index, reachable only over the Redesign Health Tailscale tailnet, and
# these runners have no Tailscale sidecar. TECH-5067 (reclaw-ea-mcp's
# Terraform + deployment flow) is where that gets wired up; don't add a
# lint/test job for either sibling here until it does — a job that can
# never succeed is worse than an explicit gap.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Pinned; must be recent enough to parse this repo's uv.lock
          # revision. Matches the Dockerfile's uv pin.
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reclaw_comms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reclaw_comms
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest --tb=short -q

  build:
    name: Docker build
    runs-on: ubuntu-latest
    # Only push on main: the ECR push role (rh-data-platform's
    # github-actions-ecr-push-role) trusts this repo's main branch only —
    # a PR/feature-branch run would fail AssumeRoleWithWebIdentity anyway,
    # so skip the push steps entirely rather than let that failure red the job.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The ea provider's extra dependency chain (reclaw_ea, scheduler_mcp,
      # rh-auth) is baked into the image regardless of ENABLED_PROVIDERS at
      # runtime -- ea-deps/'s `uv pip install` needs to reach the private
      # Gitea PyPI index (gitea.drum-mackarel.ts.net), which has no public
      # IP and is only reachable over the Redesign Health Tailscale
      # tailnet. Mirrors redesign-ai's deploy-api.yml / rh-scheduler-mcp's
      # image-build.yml: join the runner to the tailnet, then give the
      # BuildKit container itself a route to it via a host-networked
      # buildx builder.
      - name: Configure AWS credentials (CI secret reader)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_CI_READER }}
          aws-region: us-east-1

      - name: Fetch shared CI secrets from SSM
        id: ci_secrets
        uses: ./.github/actions/fetch-shared-ci-secrets

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.ci_secrets.outputs.ts_client_id }}
          oauth-secret: ${{ steps.ci_secrets.outputs.ts_client_secret }}
          tags: tag:ci

      - name: Set up Docker Buildx (host-networked builder)
        uses: docker/setup-buildx-action@v3
        with:
          # Configures the BuildKit docker-container driver itself to use
          # the host network -- without this the daemon runs in an
          # isolated namespace and can't see the runner's Tailscale
          # interface, no matter what the build asks for.
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Write Gitea netrc secret file
        env:
          GITEA_READER_TOKEN: ${{ steps.ci_secrets.outputs.gitea_token }}
        run: |
          umask 077
          printf "machine gitea.drum-mackarel.ts.net\n  login rh-reader\n  password %s\n" "$GITEA_READER_TOKEN" > /tmp/netrc

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: reclaw-comms-mcp:${{ github.sha }}
          secret-files: |
            netrc=/tmp/netrc
          # Permits --network=host in the Dockerfile's RUN steps so
          # scripts/install-ea-deps.sh can reach the Tailscale-only Gitea
          # registry during the build.
          allow: network.host
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials (dev ECR push)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-dev-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR (dev)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push image (dev)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker tag reclaw-comms-mcp:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"

      - name: Configure AWS credentials (prod ECR push)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR (prod)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push image (prod)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker tag reclaw-comms-mcp:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
