[project]
name = "reclaw-ea"
version = "0.1.0"
description = "Per-person EA agent: scheduling negotiation, preference scoring, holds/booking, autonomy gate. See docs/DESIGN.md."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    # Wires the built-but-unwired negotiation/autonomy/rules modules from
    # rh-scheduler-mcp rather than reimplementing them (docs/DESIGN.md §9
    # provenance table).
    #
    # Argus round 1 finding: a local path dependency four directories
    # above this repo (`../../../../rh-scheduler-mcp`) resolved only on
    # one specific laptop's checkout layout -- Docker builds, CI runners
    # with a single-repo checkout, and any deploy environment would all
    # fail at install time, and every module in this package imports
    # scheduler_mcp, so nothing installs or runs without it. Pinned to a
    # git SHA instead: resolves anywhere with network access to GitHub, no
    # local checkout required. `e81253e` is verified pushed to
    # redesignhealth/rh-scheduler-mcp's origin/main (not just a local
    # commit) as of this fix. Short-term improvement, not the end state --
    # switch to a versioned Gitea package once rh-scheduler-mcp cuts a
    # release (tracked as TECH-5073).
    #
    # Argus round 2 finding: this dependency chain requires more than
    # public GitHub access, and that wasn't documented anywhere in this
    # repo. rh-scheduler-mcp's OWN pyproject.toml pins `rh-auth` to a
    # PRIVATE Gitea package index (`https://gitea.drum-mackarel.ts.net/...`,
    # only reachable over the RH Tailscale tailnet) -- `uv sync`/`uv lock`
    # in THIS repo transitively resolves that index too, so anyone running
    # them needs to be on the tailnet, not just have GitHub access. This
    # succeeded when uv.lock was generated (see the lockfile's own
    # `rh-auth` entry), but will fail with an opaque network error for
    # anyone running `uv sync` off-tailnet.
    "scheduler-mcp",
]

[tool.uv.sources]
scheduler-mcp = { git = "https://github.com/redesignhealth/rh-scheduler-mcp.git", rev = "e81253ef553f419fd53e09cde64d383e8b0fcdbc" }

[project.scripts]
reclaw-ea = "reclaw_ea.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
]
# Argus round 4 finding: README documented `uv run ruff`/`uv run mypy`, but
# neither tool was declared anywhere, so a clean `uv sync` couldn't run
# them -- the documented workflow only worked by accident, on a machine
# that happened to have them installed globally.
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reclaw_ea"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Explicit ruff/mypy config, even though these match each tool's own
# defaults: reclaw-comms-mcp's pyproject.toml one directory up sets
# `[tool.ruff]`/`[tool.mypy] strict = true`, and both tools' config
# discovery walks up parent directories to find a pyproject.toml -- without
# a `[tool.ruff]`/`[tool.mypy]` table here, running `ruff`/`mypy` from
# inside this directory silently inherits the sibling project's config
# instead of using this project's own defaults. Also pin `--config-file`
# in the documented commands (README.md) for the same reason: explicit
# sections here stop *this* project's own config from being picked up by
# ANOTHER tool invocation one level up, but don't stop `mypy`/`ruff`
# invoked from elsewhere in the tree from finding reclaw-comms-mcp's
# config first if it's closer to the invocation's cwd.
[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
