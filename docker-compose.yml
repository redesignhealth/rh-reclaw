# Local development stack. Secrets come from a gitignored .env file
# (copy .env.example). Postgres backs the comms domain (message/permission
# state, DESIGN.md §5). After `docker compose up -d postgres`, run
# `uv run alembic upgrade head` (with DATABASE_URL pointed at this service)
# to create the schema — see README.md's "Database / migrations" section.
services:
  reclaw-comms-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Bind 0.0.0.0 inside the container so the port mapping works
      # (prod binds loopback behind the Tailscale sidecar).
      MCP_HOST: 0.0.0.0
      BASE_URL: http://localhost:8080
      MCP_TOKEN_STORAGE_PATH: /data/fastmcp-tokens
      OKTA_ISSUER_URL: ${OKTA_ISSUER_URL}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET}
      RH_AUTH_SECRET: ${RH_AUTH_SECRET}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reclaw_comms
    volumes:
      - token-storage:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reclaw_comms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  token-storage:
  postgres-data:
