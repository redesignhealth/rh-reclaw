[project]
name = "reclaw-ea-mcp"
version = "0.1.0"
description = "MCP service wrapping the reclaw-ea Negotiator: per-owner scheduling negotiation, holds/booking, autonomy gate. See ../reclaw-ea/docs/DESIGN.md §1a."
requires-python = ">=3.12,<3.14"
# Upper-bounded (unlike the sibling projects' unbounded ">=3.12"): this
# project's dependency graph includes reclaw-ea as a path dependency, which
# transitively pulls in scheduler-mcp's git-SHA-pinned `rh-auth` requirement.
# uv's universal resolution solves across the ENTIRE requires-python range,
# including hypothetical future Python versions with no `rh-auth` release
# at all -- that branch is unsolvable and, left unbounded, fails the whole
# resolution with a confusing "no solution found" error even though nothing
# actually runs on that hypothetical interpreter. Bounding at <3.14 (Python
# 3.12/3.13 are what's actually deployed across the fleet) avoids resolving
# for versions this service will never run on.
#
# Exact pins per the RH dependency-pinning policy (topics/09-security.md),
# matching reclaw-comms-mcp's own pins so MultiAuth/OIDCProxy/JWTVerifier
# behavior is identical across the fleet.
dependencies = [
    "fastmcp==3.4.2",
    "py-key-value-aio[filetree]==0.4.5",
    "pydantic==2.12.5",
    "structlog==25.5.0",
    # The library this service wraps -- lives one directory up as a sibling
    # project (see rh-reclaw's root README / the monorepo layout decision).
    # Path dependency is fine here (unlike reclaw-ea's OWN scheduler-mcp
    # dependency, which needed a git SHA -- see reclaw-ea/pyproject.toml's
    # comment): both projects live in the same repo and are always checked
    # out together, so there is no "resolves on one laptop's layout only"
    # failure mode a git-SHA pin would be protecting against.
    "reclaw-ea",
]

[tool.uv.sources]
reclaw-ea = { path = "../reclaw-ea", editable = true }

[tool.uv.workspace]
# Explicit empty workspace declaration: without this, uv walks up to the
# nearest ancestor pyproject.toml (reclaw-comms-mcp's, one directory up)
# and treats IT as this project's implicit workspace root, inheriting its
# `[tool.uv]` settings key-by-key for anything unset here -- including
# `exclude-newer = "7 days"`, which breaks resolution entirely (see the
# `[tool.uv]` table below). Declaring this directory as its own workspace
# root (no members beyond itself) stops that upward walk. `reclaw-ea`
# (the path dependency above) is deliberately NOT listed as a member: it
# is a separate, independently-versioned sibling project with its own
# pyproject.toml and lockfile, not a workspace member of this one.
members = ["."]

[dependency-groups]
# Exact pins (Argus round 1 finding): reclaw-comms-mcp uses exact pins for
# its dev/test deps; the lower-bounded `>=` versions here let `uv lock
# --upgrade` silently advance dev tools out from under CI without a diff
# to review.
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
dev = [
    "ruff==0.16.2",
    "mypy==2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["tests/"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
# Neither reclaw-ea (the sibling path dependency) nor scheduler-mcp (its
# own git-pinned dependency) ships a py.typed marker or stubs -- same gap
# reclaw-ea/README.md's own mypy invocation documents for itself.
module = ["reclaw_ea.*", "scheduler_mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = []

# Deliberately NOT set here, unlike reclaw-comms-mcp's identical-looking
# `exclude-newer = "7 days"` one directory up (supply-chain defense,
# rh-mcp/rh-google-mcp idiom): this project's dependency graph includes
# reclaw-ea as a path dependency, which transitively pulls in
# scheduler-mcp's git-pinned `rh-auth` requirement from the private Gitea
# index. Gitea's simple index does not report real upload-date metadata
# for its packages, so ANY active exclude-newer cutoff -- global or via
# `exclude-newer-package`, inherited or set directly here -- makes uv
# treat every rh-auth version as excluded (it synthesizes the missing
# upload date as exactly equal to whatever cutoff is in effect, which then
# fails the strict less-than comparison regardless of the cutoff's actual
# value). reclaw-ea's own pyproject.toml never sets this for the same
# reason. The `[tool.uv.workspace]` declaration above (not this comment
# alone) is what actually prevents inheriting root's setting -- without
# it, uv walks up to the nearest ancestor pyproject.toml and applies its
# `[tool.uv]` table key-by-key for anything left unset here.
[tool.uv]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
